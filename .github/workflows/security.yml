name: Security

# Dependency and secret hygiene.
#
# Scheduled as well as per-PR: a dependency that was clean when it merged can
# become vulnerable a week later without anyone touching the repository.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays, 06:00 UTC — before the working week rather than during it.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - name: Audit infrastructure dependencies
        working-directory: infra
        run: |
          npm ci --ignore-scripts
          # Fails on high and critical only. Anything lower is triaged rather
          # than blocking, so the signal here stays worth reading.
          npm audit --audit-level=high

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Check for outdated Dart packages
        working-directory: app
        run: |
          flutter pub get
          # Reports without failing: Dart has no severity-rated audit feed, so
          # this is information for a human, not a gate.
          flutter pub outdated || true

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks needs history to scan the whole tree

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  phi-guard:
    name: PHI guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # The synthetic dataset is fine — it is fictional and gated behind a
      # compile-time flag. What must never appear is real patient data, or a
      # code path that writes identifiers somewhere they are retained.
      - name: No patient identifiers in URLs
        run: |
          # Patient ids belong in request bodies. A path parameter lands in API
          # Gateway access logs, CloudFront logs, and browser history, all
          # retained far longer than the request itself.
          if grep -rnE "'/v1/patients/\\\$\{|\`/v1/patients/\\\$\{" \
               infra/lambda app/lib 2>/dev/null; then
            echo "::error::A patient id is being interpolated into a URL path."
            exit 1
          fi
          echo "No patient identifiers in URL paths."

      - name: Request and response bodies are not logged
        run: |
          if grep -rn "LOG_BODIES.*true" infra/ 2>/dev/null; then
            echo "::error::Body logging is enabled. Bodies carry PHI."
            exit 1
          fi
          echo "Body logging is off."

      - name: Demo seed defaults to off
        run: |
          if grep -q "defaultValue: true" app/lib/core/env/app_config.dart; then
            echo "::error::A build flag in app_config.dart defaults to true."
            echo "SINEOBEX_DEMO_SEED in particular must default to false."
            exit 1
          fi
          echo "Build flags default to off."

      - name: Cron jobs carry no patient data
        run: |
          # cron-job.org is not a business associate and must never be in a
          # position to need one.
          if grep -nE '"(patientId|patient_id|dob|name|memberId)"' cron/jobs.json; then
            echo "::error::A cron job payload references patient data."
            exit 1
          fi
          echo "Cron payloads carry no patient data."
