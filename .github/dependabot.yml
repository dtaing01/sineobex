# Weekly dependency updates. Grouped so a week's minor and patch bumps arrive as one reviewable PR
# per ecosystem; major versions come separately because they need a human read of the changelog.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 10
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: pub
    directory: /apps/mobile
    schedule: { interval: weekly, day: monday }
    groups:
      pub-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions:
        patterns: ['*']
